<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the value of `flutter build --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#26374d">

  <title>quizzle — live quizzes from your lecture material</title>
  <meta name="description"
        content="Turn a PDF, slide deck or photo of a whiteboard into a live, gamified quiz in minutes. Students join with a code and compete on a live leaderboard.">

  <!-- Link previews. Without these, a join link pasted into a class chat renders
       as a bare URL, which undercuts the whole share-a-code flow. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="quizzle">
  <meta property="og:title" content="Join a live quiz on quizzle">
  <meta property="og:description"
        content="Your teacher started a live quiz. Enter the code to play and see where you land on the leaderboard.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Join a live quiz on quizzle">
  <meta name="twitter:description"
        content="Your teacher started a live quiz. Enter the code to play.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="quizzle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Painted before Flutter boots, so the first frame is brand navy rather than
       a white flash. Matches --navy / --ice-mist in docs/DESIGN.md. */
    html, body { margin: 0; padding: 0; height: 100%; background: #dde6ed; }
    @media (prefers-color-scheme: dark) { html, body { background: #1a2735; } }
    /* pointer-events:none so it can never intercept taps even if the removal
       below is missed; Flutter paints over it regardless. */
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; font: 600 13px/1 system-ui, sans-serif;
      letter-spacing: 0.12em; text-transform: uppercase; color: #536d82;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="boot">quizzle</div>
  <script>
    // Flutter dispatches this on the document once the first frame is on screen.
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) b.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
